name: Publish Package to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version and npm dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== version && tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must match package.json version ${version} (with an optional v prefix).`);
          }

          const prerelease = /^\d+\.\d+\.\d+-/.test(version);
          if (prerelease !== (process.env.RELEASE_PRERELEASE === 'true')) {
            throw new Error('The GitHub Release prerelease flag must match the package.json version.');
          }

          const distTag = prerelease ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          console.log(`Publishing testing-mcp@${version} with npm dist-tag ${distTag}`);
          NODE
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
      - name: Check package contents
        run: npm pack --dry-run --json
      - name: Publish to npm using OIDC
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --registry=https://registry.npmjs.org --access public --provenance --tag "$NPM_DIST_TAG"
